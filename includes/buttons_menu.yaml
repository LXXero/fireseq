# Menu-based panel buttons (7 buttons via ADC resistor ladder)
# Requires substitution: gpio_buttons_adc
#
# Button layout:
#   Toggle     - activate/deactivate system
#   Menu ↑↓    - switch display screens (Status, Effects, etc.)
#   Select ↑↓  - scroll within current context (effects, history)
#   Type ↑↓    - change effect type (fire/march/code/doorbell)
#
# Hardware setup: 10 x 1K resistors in series from 3.3V to GND
# Buttons connect ADC pin to each tap point
# Use external 10K pullup from gpio_buttons_adc to 3.3V
#
# Wiring diagram:
#   3.3V
#    |
#   [1K]--- Toggle       (2.97V)
#   [1K]--- Menu Up      (2.64V)
#   [1K]--- Menu Down    (2.31V)
#   [1K]--- Type Up      (1.98V)
#   [1K]--- Type Down    (1.65V)
#   [1K]--- Select Up    (1.32V)
#   [1K]--- Select Down  (0.99V)
#   [1K]--- (future)     (0.66V)
#   [1K]--- (future)     (0.33V)
#   [1K]--- (future)     (0.00V)
#    |
#   GND

sensor:
  - platform: adc
    pin:
      number: ${gpio_buttons_adc}
      mode:
        input: true
    id: button_ladder
    name: "Button Ladder"
    internal: true
    update_interval: 20ms
    attenuation: 12db
    filters:
      - median:
          window_size: 7
          send_every: 1
      - delta: 0.05

binary_sensor:
  - platform: template
    name: "Toggle"
    lambda: |-
      float v = id(button_ladder).state;
      return (v >= 2.85 && v <= 3.05);
    filters:
      - delayed_on: 10ms
    on_press:
      - switch.toggle: toggle

  - platform: template
    name: "Menu Up"
    lambda: |-
      float v = id(button_ladder).state;
      return (v >= 2.60 && v <= 2.84);
    filters:
      - delayed_on: 10ms
    on_press:
      - script.execute:
          id: menu_navigate
          direction: up

  - platform: template
    name: "Menu Down"
    lambda: |-
      float v = id(button_ladder).state;
      return (v >= 2.35 && v <= 2.59);
    filters:
      - delayed_on: 10ms
    on_press:
      - script.execute:
          id: menu_navigate
          direction: down

  - platform: template
    name: "Type Up"
    lambda: |-
      float v = id(button_ladder).state;
      return (v >= 2.05 && v <= 2.34);
    filters:
      - delayed_on: 10ms
    on_press:
      - script.execute:
          id: type_button
          direction: up

  - platform: template
    name: "Type Down"
    lambda: |-
      float v = id(button_ladder).state;
      return (v >= 1.89 && v <= 2.10);
    filters:
      - delayed_on: 10ms
    on_press:
      - script.execute:
          id: type_button
          direction: down

  - platform: template
    name: "Select Up"
    lambda: |-
      float v = id(button_ladder).state;
      return (v >= 1.60 && v <= 1.88);
    filters:
      - delayed_on: 10ms
    on_press:
      - script.execute:
          id: select_button
          direction: up

  - platform: template
    name: "Select Down"
    lambda: |-
      float v = id(button_ladder).state;
      return (v >= 1.30 && v <= 1.59);
    filters:
      - delayed_on: 10ms
    on_press:
      - script.execute:
          id: select_button
          direction: down
