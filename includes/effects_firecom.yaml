# Firecom Effects
# These effects implement Firecom signaling modes

light:
  - id: !extend code
    effects:
      - lambda:
          name: Firecom
          update_interval: 1500ms
          lambda: |-
            static int state = 0;
            if (initial_run) {
              state = 0;
            }
            if (state == 0 || state == 11 ) {
              id(code_output).turn_off();
            } else {
              id(code_output).turn_on();
            }

            if (state <11 && state != 0) {
              id(trigger).turn_off();
            } else {
              id(trigger).turn_on();
            }

            state += 1;
            if (state == 20)
              state = 0;

      - lambda:
          name: Firecom Whoop
          update_interval: 250ms
          lambda: |-
            if (initial_run) {
              id(code_output).turn_on();
              id(reverse).turn_off();
              id(trigger).turn_off();
            }

      - lambda:
          name: Firecom Chime
          update_interval: 250ms
          lambda: |-
            if (initial_run) {
              id(code_output).turn_on();
              id(reverse).turn_off();
              id(trigger).turn_on();
            }

      - lambda:
          name: Firecom Pulsed Tone
          update_interval: 250ms
          lambda: |-
            if (initial_run) {
              id(code_output).turn_on();
              id(reverse).turn_on();
              id(trigger).turn_on();
            }

      - lambda:
          name: Firecom Steady Tone
          update_interval: 250ms
          lambda: |-
            if (initial_run) {
              id(code_output).turn_on();
              id(reverse).turn_on();
              id(trigger).turn_off();
            }

# Add Firecom effects to firecom_effects list on boot
esphome:
  on_boot:
    - priority: 100
      then:
        - lambda: |-
            id(firecom_effects).push_back("Firecom");
            id(firecom_effects).push_back("Firecom Whoop");
            id(firecom_effects).push_back("Firecom Chime");
            id(firecom_effects).push_back("Firecom Pulsed Tone");
            id(firecom_effects).push_back("Firecom Steady Tone");
