# Menu-based panel buttons (7 buttons via separate GPIOs)
# Requires substitutions: gpio_toggle, gpio_menu_up, gpio_menu_down,
#   gpio_type_up, gpio_type_down, gpio_select_up, gpio_select_down
#
# Button layout:
#   Toggle     - activate/deactivate system
#   Menu ↑↓    - switch display screens (Status, Effects, Howe)
#   Type ↑↓    - change effect type or Howe display mode
#   Select ↑↓  - scroll within current context

binary_sensor:
  - name: Toggle
    platform: gpio
    pin:
      number: ${gpio_toggle}
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_on: 10ms
    on_click:
      - switch.toggle: toggle

  - name: "Menu Up"
    platform: gpio
    pin:
      number: ${gpio_menu_up}
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_on: 10ms
    on_click:
      - script.execute:
          id: menu_navigate
          direction: up

  - name: "Menu Down"
    platform: gpio
    pin:
      number: ${gpio_menu_down}
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_on: 10ms
    on_click:
      - script.execute:
          id: menu_navigate
          direction: down

  - name: "Type Up"
    platform: gpio
    pin:
      number: ${gpio_type_up}
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_on: 10ms
    on_click:
      - script.execute:
          id: type_button
          direction: up

  - name: "Type Down"
    platform: gpio
    pin:
      number: ${gpio_type_down}
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_on: 10ms
    on_click:
      - script.execute:
          id: type_button
          direction: down

  - name: "Select Up"
    platform: gpio
    pin:
      number: ${gpio_select_up}
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_on: 10ms
    on_click:
      - script.execute:
          id: select_button
          direction: up

  - name: "Select Down"
    platform: gpio
    pin:
      number: ${gpio_select_down}
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_on: 10ms
    on_click:
      - script.execute:
          id: select_button
          direction: down
