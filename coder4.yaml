# AC/DC powered ESP32 Relay Board x4
# https://devices.esphome.io/devices/AC-DC-ESP32-Relay-x4

substitutions:
  name: 'coder4'
  # Outputs
  gpio_code: 'GPIO32'
  gpio_led: 'GPIO23'
  gpio_led_invert: 'true'
  gpio_reverse: 'GPIO25'
  gpio_shunt: 'GPIO33'
  gpio_trigger: 'GPIO26'
  # Inputs
  gpio_zone: 'GPIO27'
  gpio_zone_invert: 'true'
  gpio_presignal: 'GPIO34'
  gpio_presignal_invert: 'false'
  # I2C (for OLED)
  gpio_scl: 'GPIO16'
  gpio_sda: 'GPIO17'
  # Panel buttons (menu layout)
  gpio_toggle: 'GPIO19'
  gpio_menu_up: 'GPIO21'
  gpio_menu_down: 'GPIO18'
  gpio_type_up: 'GPIO4'
  gpio_type_down: 'GPIO13'
  gpio_select_up: 'GPIO14'
  gpio_select_down: 'GPIO22'

packages:
  main: !include main.yaml
  fire: !include includes/effects_fire.yaml
  firecom: !include includes/effects_firecom.yaml
  buttons: !include includes/buttons_menu_gpio.yaml
  display: !include includes/display_oled.yaml
